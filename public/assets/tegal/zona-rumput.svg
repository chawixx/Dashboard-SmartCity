<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08192e"/>
      <stop offset="40%" stop-color="#0a3348"/>
      <stop offset="100%" stop-color="#04271e"/>
    </linearGradient>
    <radialGradient id="turfGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#08192e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="750" r="500" fill="url(#turfGlow)"/>

  <!-- Geometric Synthetic Turf Field Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35" fill="none">
    <ellipse cx="400" cy="720" rx="320" ry="160"/>
    <ellipse cx="400" cy="720" rx="240" ry="120"/>
    <ellipse cx="400" cy="720" rx="140" ry="70"/>
    <line x1="400" y1="560" x2="400" y2="880"/>
    <line x1="80" y1="720" x2="720" y2="720"/>
  </g>

  <!-- Telemetry Overlay Grid -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="400" cy="720" r="6"/>
    <circle cx="400" cy="720" r="14" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="280" cy="690" r="3"/>
    <circle cx="520" cy="690" r="3"/>
    <circle cx="340" cy="760" r="3"/>
    <circle cx="460" cy="760" r="3"/>
  </g>

  <!-- Technical Reticles -->
  <text x="400" y="240" font-family="'Onest', sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    ZONA RUMPUT SINTETIS
  </text>
  <text x="400" y="280" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    6°52'08.2"S 109°08'18.8"E • ALUN-ALUN
  </text>
</svg>
