<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08192e"/>
      <stop offset="100%" stop-color="#030b14"/>
    </linearGradient>
    <radialGradient id="antennaPulse" cx="50%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08192e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#nodeBg)"/>
  
  <!-- Wi-Fi Waves Pulse -->
  <circle cx="400" cy="180" r="80" fill="url(#antennaPulse)"/>
  <circle cx="400" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="400" cy="180" r="200" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Antenna Tip -->
  <line x1="400" y1="180" x2="400" y2="300" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="400" cy="180" r="8" fill="#38bdf8"/>

  <!-- Weatherproof Enclosure Body (ESP32-S3 Box) -->
  <rect x="250" y="300" width="300" height="360" rx="24" fill="#0f2642" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Screws on Corners -->
  <circle cx="275" cy="325" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="525" cy="325" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="275" cy="635" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="525" cy="635" r="5" fill="#38bdf8" opacity="0.6"/>

  <!-- Sensor Vents (DHT22 Grille) -->
  <rect x="290" y="360" width="220" height="90" rx="12" fill="#071524" stroke="rgba(255,255,255,0.15)"/>
  <g stroke="#38bdf8" stroke-width="3" opacity="0.7">
    <line x1="320" y1="380" x2="480" y2="380"/>
    <line x1="320" y1="405" x2="480" y2="405"/>
    <line x1="320" y1="430" x2="480" y2="430"/>
  </g>

  <!-- MQ135 Sensing Chamber -->
  <circle cx="400" cy="530" r="45" fill="#071524" stroke="#0284c7" stroke-width="2"/>
  <circle cx="400" cy="530" r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="400" cy="530" r="10" fill="#10b981"/>

  <!-- Label on Node -->
  <text x="400" y="610" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    ESP32-S3 • TEGAL ECOSENSE
  </text>
</svg>
